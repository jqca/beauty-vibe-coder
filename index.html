<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>美容 Vibe Coder</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  <script>
/* JQCA Quantum Vibe Coder - IP Guard v2
   - 画面右下に免責フッターを固定表示
   - 中央コードパネルの文字を常時ブラー（バイブコーディング速度の体感は維持）
   - user-select禁止でコピー防止 */
(function () {
  function addFooter() {
    if (document.getElementById("jqca-ip-footer")) return;
    var f = document.createElement("div");
    f.id = "jqca-ip-footer";
    f.style.cssText =
      "position:fixed;bottom:4px;right:10px;font-size:10px;color:rgba(255,255,255,0.45);z-index:9999;" +
      "background:rgba(0,0,0,0.35);padding:3px 8px;border-radius:4px;pointer-events:auto;" +
      "font-family:-apple-system,'Segoe UI','Hiragino Sans',sans-serif;";
    f.innerHTML =
      '&#9888; \u30c7\u30e2\u7528\u7c21\u7565\u30b5\u30f3\u30d7\u30eb\u5b9f\u88c5 | \u516c\u77e5\u30a2\u30eb\u30b4\u30ea\u30ba\u30e0\u306e\u6559\u80b2\u30c7\u30e2 | ' +
      '<a href="/terms.html" target="_blank" rel="noopener" style="color:rgba(255,255,255,0.7);text-decoration:underline;">\u5229\u7528\u898f\u7d04</a> | ' +
      '&copy; 2026 JQCA';
    document.body.appendChild(f);
  }

  function addBlurStyle() {
    if (document.getElementById("jqca-blur-style")) return;
    var style = document.createElement("style");
    style.id = "jqca-blur-style";
    style.textContent =
      /* 中央コードパネルの「ヘッダー以外」をブラー。ヘッダー（ファイル名表示）はクリアに残す */
      ".app-container > .pane:nth-child(2) > *:not(.pane-header) {" +
      "  filter: blur(4px) !important;" +
      "  -webkit-filter: blur(4px) !important;" +
      "  user-select: none !important;" +
      "  -webkit-user-select: none !important;" +
      "  pointer-events: none !important;" +
      "}" +
      /* Firefox/Safariでのコピー防止補強 */
      ".app-container > .pane:nth-child(2) * {" +
      "  -webkit-touch-callout: none !important;" +
      "}";
    document.head.appendChild(style);
  }

  function init() {
    addFooter();
    addBlurStyle();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>

  </body>
</html>
